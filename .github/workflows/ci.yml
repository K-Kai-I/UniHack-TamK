# Kiểm tra tự động cho mỗi Pull Request và mỗi lần đẩy lên main:
# contract (86+ test, có fuzz và bất biến), kiểu TypeScript, test khớp chéo backend ↔ contract, test module AI.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: npm run setup
      - run: forge test
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run be:test
      - run: npm run ai:test
